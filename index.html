<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, width=device-width, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Sourcebook</title>
<link rel="stylesheet" type="text/css" href="css/ios6.css">
</head>
<body>

<div class="navbar">
  <a class="nav-btn nav-left" href="faq.html">About</a>
  <a class="nav-btn nav-right" href="softboard.html">Softboard</a>
  <h1 class="nav-title">Sourcebook</h1>
</div>

<div class="content">

  <div class="group-header">Serves</div>
  <div class="group">
    <div class="row">
      <span class="row-label">Repositories that serve</span>
      <select id="ios-select" class="ios-select">
        <option value="all">All</option>
        <option value="1">iOS 1</option>
        <option value="2">iOS 2</option>
        <option value="3">iOS 3</option>
        <option value="4">iOS 4</option>
        <option value="5">iOS 5</option>
        <option value="6" selected>iOS 6</option>
        <option value="7">iOS 7</option>
        <option value="8">iOS 8</option>
        <option value="9">iOS 9</option>
      </select>
    </div>
  </div>

  <div class="group-header">Search</div>
  <div class="group">
    <div class="row search-row">
      <input type="search" id="search-box" class="search-box" placeholder="Repo or tweak name" autocomplete="off" autocorrect="off" autocapitalize="off">
    </div>
  </div>

  <div class="group-header">Sort</div>
  <div class="group">
    <div class="row">
      <span class="row-label">Sort by</span>
      <select id="sort-select" class="ios-select">
        <option value="default" selected>Default</option>
        <option value="name">Name</option>
        <option value="status">Status</option>
        <option value="tweaks">Most tweaks</option>
        <option value="saved">Saved first</option>
      </select>
    </div>
  </div>

  <div class="group-header" id="recent-header" style="display:none">Recently changed</div>
  <div class="group" id="recent-list" style="display:none"></div>

  <div class="group-header" id="sheet-header" style="display:none">Tweak</div>
  <div class="group" id="sheet" style="display:none"></div>

  <div class="group-header">Repositories</div>
  <div class="group" id="repo-list">
    <div class="row"><span class="row-label muted">Loading…</span></div>
  </div>

  <div class="group-header">Get listed</div>
  <div class="group">
    <div class="row-action">
      <a href="https://github.com/deepdiver26/Sourcebook/issues/new?title=Add+my+repo+to+Sourcebook&amp;body=Repo+name%3A%0ARepo+URL%3A%0AiOS+versions+it+serves%3A%0ATweaks+%28name+and+one+line+each%29%3A%0AI+am+the+owner+and+agree+to+be+listed%3A+yes%2Fno" class="report-link">Add your repo</a>
    </div>
  </div>

  <div class="footer" id="updated-text"></div>
</div>

<script type="text/javascript" src="js/app.js"></script>
</body>
</html>
